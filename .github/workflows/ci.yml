name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -s settings.xml -B test

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  real-databases:
    name: MySQL and PostgreSQL safety
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Start read-only demo databases
        run: docker compose up -d --wait mysql postgres

      - name: Run real database safety test
        working-directory: backend
        run: mvn -s settings.xml -B -Dtest=RealDatabaseSafetyIT test

      - name: Tear down
        if: always()
        run: docker compose down -v

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch whitespace check
        run: git diff --check HEAD

      - name: Tracked secret scan
        run: node scripts/check-secrets.mjs

  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend, real-databases, repository-hygiene]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:19030/api/health/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs backend
          exit 1

      - name: Mock demo smoke (scripts/smoke-mock-demo.mjs)
        run: node scripts/smoke-mock-demo.mjs http://localhost:19030

      - name: Authenticated local performance gate
        run: python loadtest/dry_run.py --base-url http://localhost:19030/api --iterations 9 --concurrency 3

      - name: Frontend smoke
        run: curl -sf http://localhost:19031/ >/dev/null

      - name: Tear down
        if: always()
        run: docker compose down -v
