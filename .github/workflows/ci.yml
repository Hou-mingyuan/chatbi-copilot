name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -s settings.xml -B test

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Unit tests (ResultPanel)
        run: npm test

  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          cp .env.example .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs backend
          exit 1

      - name: Mock demo smoke (scripts/smoke-mock-demo.mjs)
        run: node scripts/smoke-mock-demo.mjs http://localhost:8080

      - name: Python dry-run loadtest
        run: python loadtest/dry_run.py --base-url http://localhost:8080/api

      - name: Tear down
        if: always()
        run: docker compose down -v
