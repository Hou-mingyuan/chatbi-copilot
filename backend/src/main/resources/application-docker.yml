spring:
  datasource:
    url: jdbc:h2:file:/app/data/chatbi;AUTO_SERVER=TRUE;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE

chatbi:
  demo-datasource:
    enabled: ${DEMO_DATASOURCE_ENABLED:true}
