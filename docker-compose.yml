services:
  mysql:
    image: mysql:8.0
    container_name: chatbi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatbi_demo}
      MYSQL_USER: ${MYSQL_USER:-chatbi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatbi123}
    ports:
      # Default 13306 avoids conflict with local MySQL on Windows/macOS (3306 often in use).
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      # Auto-loads schema + seed on first start (executed in filename order)
      - ./sample-data/mysql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: chatbi-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      CHATBI_SECRET: ${CHATBI_SECRET:-chatbi-copilot-dev-secret-change-me}
      DEMO_DATASOURCE_ENABLED: "true"
      DEMO_DB_HOST: mysql
      DEMO_DB_PORT: "3306"
      DEMO_DB_NAME: ${MYSQL_DATABASE:-chatbi_demo}
      DEMO_DB_USER: ${MYSQL_USER:-chatbi}
      DEMO_DB_PASSWORD: ${MYSQL_PASSWORD:-chatbi123}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: chatbi-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8888}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-data:
